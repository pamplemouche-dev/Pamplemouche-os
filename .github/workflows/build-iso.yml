name: Build FreeBSD Distribution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_DIR: artifacts

jobs:
  validate:
    name: Validate repository layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts and layout
        run: make validate test

  build-image:
    name: Build FreeBSD image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FreeBSD image in VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "14.1"
          mem: 8192
          copyback: true
          run: |
            set -eu
            pkg update
            pkg install -y xorriso e2fsprogs
            cd "${{ github.workspace }}"
            chmod +x scripts/*.sh tests/*.sh distribution/ui/openbox/autostart.sh
            TAG="${GITHUB_REF_NAME:-ci}" make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-build
          path: |
            artifacts/*.iso
            artifacts/*.img
            artifacts/*.sha256
          if-no-files-found: error

  package:
    name: Package release bundle
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: freebsd-build
          path: artifacts

      - name: Package artifacts
        run: TAG="${GITHUB_REF_NAME:-ci}" make package

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-package
          path: artifacts/pamplemouche-os-*-artifacts.tar.gz
          if-no-files-found: error

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: freebsd-package
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/pamplemouche-os-*-artifacts.tar.gz
