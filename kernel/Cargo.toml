[package]
name = "pamplemouche-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pamplemouche-kernel"
path = "src/main.rs"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
x86_64 = "0.14"
uart_16550 = "0.2"
pic8259 = "0.10"
pc-keyboard = "0.7"
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
